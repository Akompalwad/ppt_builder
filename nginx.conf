events {}
http {
  upstream streamlit { server streamlit:8501; }
  upstream api { server api:8000; }
  server {
    listen 80;
    client_max_body_size 25m;
    location /api/ { proxy_pass http://api; proxy_read_timeout 120s; }
    location / { proxy_pass http://streamlit; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; proxy_read_timeout 120s; }
  }
}
